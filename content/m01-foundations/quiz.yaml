questions:
  - scenario: "Copilot gives you a fluent answer with a specific date and no citation."
    question: "What is the best first step?"
    options:
      - "Accept it; the tone is confident"
      - "Ask for the source and open it"
      - "Ask the same question again until two answers agree"
      - "Switch to Web mode"
    answer: 1
    explanation: "Confidence is not evidence, and repeated answers can share the same error. Ask for the source and check it."
  - scenario: "You are on a Premium licence and switch to Work grounding to answer a question about a project decision."
    question: "With Work grounding, what can Copilot find?"
    options:
      - "Everything in the company"
      - "Only what you already have permission to open"
      - "Only files in your OneDrive"
      - "Only documents you created"
    answer: 1
    explanation: "Work grounding searches with your permissions, so it can only find what you could open yourself. It does not see the whole company, and it is not limited to OneDrive or to your own documents."
  - scenario: "A colleague on Copilot Chat asks why Copilot cannot find a decision buried in their mailbox and Teams chats."
    question: "Which capability needs a Premium licence?"
    options:
      - "Web-grounded chat"
      - "Uploading a file to chat"
      - "Searching your mailbox and Teams chats"
      - "Creating a notebook"
    answer: 2
    explanation: "Searching your mail, meetings, chats and files is a Premium feature. Web-grounded chat, uploaded files and notebooks all work on Copilot Chat."
  - scenario: "You write the prompt: 'If the document doesn't say, write not stated.'"
    question: "What does this mainly prevent?"
    options:
      - "Long answers"
      - "Copilot filling gaps with plausible inventions"
      - "Citation errors"
      - "Stale results"
    answer: 1
    explanation: "The instruction gives Copilot permission to leave a gap instead of inventing a plausible answer. It does not control length, citations or how recent a source is."
  - scenario: "Hannah sends a customer email containing a Copilot-drafted commitment that turns out to be wrong."
    question: "Who is accountable?"
    options:
      - "Microsoft"
      - "Whoever wrote the prompt"
      - "Hannah, the sender"
      - "Nobody, because it was AI-generated"
    answer: 2
    explanation: "The sender owns the content, however it was drafted. Accountability does not move to the tool or to whoever wrote the prompt."
